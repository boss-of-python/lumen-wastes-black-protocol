name: "Build Android APK (LUMEN WASTES: BLACK PROTOCOL)"

on:
  push:
    branches: [ main, master, arena/** ]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# 100% offline game build — no network calls at runtime; the workflow only
# fetches build tooling (Godot, JDK, Android SDK) from official sources.

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"
  GODOT_HEADLESS_URL: "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_PLATFORM: "android-34"
  JAVA_VERSION: "17"
  APK_NAME: "LumenWastes-BlackProtocol-Offline.apk"

jobs:
  build-android-apk:
    name: Build & Upload Offline Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies (Pillow + NumPy)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow numpy

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download Godot 4.3 headless Linux binary
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/godot.zip" "$GODOT_HEADLESS_URL"
          test -s "$RUNNER_TEMP/godot.zip"
          unzip -o "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Verify Godot version
        run: "$GODOT_BIN --version"

      - name: Install Android SDK command-line tools
        run: |
          # Use RUNNER_TEMP so the SDK lives outside the Godot project dir.
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fL --retry 3 --retry-delay 2 \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o "$RUNNER_TEMP/cmdline-tools.zip"
          test -s "$RUNNER_TEMP/cmdline-tools.zip"
          unzip -o "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-tools"
          mv "$RUNNER_TEMP/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Accept SDK licenses and install platform/build-tools
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Install Godot Android export templates
        run: |
          TEMPLATES_URL="https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATES_DIR"
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/export_templates.tpz" "$TEMPLATES_URL"
          test -s "$RUNNER_TEMP/export_templates.tpz"
          unzip -o "$RUNNER_TEMP/export_templates.tpz" -d "$RUNNER_TEMP/export_templates_extract"
          if [ -d "$RUNNER_TEMP/export_templates_extract/templates" ]; then
            cp -r "$RUNNER_TEMP/export_templates_extract/templates/." "$TEMPLATES_DIR/"
          elif [ -d "$RUNNER_TEMP/export_templates_extract/4.3.stable" ]; then
            cp -r "$RUNNER_TEMP/export_templates_extract/4.3.stable/." "$TEMPLATES_DIR/"
          else
            cp -r "$RUNNER_TEMP/export_templates_extract/." "$TEMPLATES_DIR/"
          fi
          test -f "$TEMPLATES_DIR/android_debug.apk" || { echo "::error::Android export template (android_debug.apk) not found in $TEMPLATES_DIR"; exit 1; }
          echo "Android export templates installed at $TEMPLATES_DIR"

      - name: Generate 4-map PBR assets
        run: |
          python3 tools/asset_gen/generate_pbr_assets.py

      - name: Validate scripts and scenes (import/parse check)
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --editor --quit --import \
            2>&1 | tee godot-import.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "::error::Godot import failed"
            exit 1
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Failed to instantiate an autoload|Failed to create an autoload|Cannot export project" godot-import.log; then
            echo "::error::Godot reported script or project errors"
            grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Failed to instantiate an autoload|Failed to create an autoload|Cannot export project" godot-import.log
            exit 1
          fi
          echo "::notice::Import / parse check passed with no script errors"

      - name: Run headless test suite (30 endings, Gunsmith, physics, offline rules)
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script res://tests/test_runner.gd \
            2>&1 | tee godot-test.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "::error::Godot test runner failed"
            exit 1
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|FAILED|failed|Failed to" godot-test.log; then
            echo "::error::Test runner reported an engine or test failure"
            grep -E "SCRIPT ERROR|Parse Error|Compile Error|FAILED|failed|Failed to" godot-test.log
            exit 1
          fi
          echo "::notice::Test suite passed with no engine errors"

      - name: Verify export preset exists
        run: |
          if ! grep -Fx 'name="Android (100% Offline APK)"' export_presets.cfg; then
            echo "::error::Preset 'Android (100% Offline APK)' not found in export_presets.cfg"
            exit 1
          fi
          echo "::notice::Preset 'Android (100% Offline APK)' found in export_presets.cfg"

      - name: Scan project for forbidden network permissions
        run: |
          if grep -R -n -E "INTERNET|ACCESS_NETWORK_STATE|android.permission.INTERNET|android.permission.ACCESS_NETWORK_STATE" \
            export_presets.cfg project.godot src assets data .github 2>/dev/null; then
            echo "::error::Network permission or network-access reference detected"
            exit 1
          fi
          echo "::notice::No network permission references found in project"

      - name: Export Android APK (debug)
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless \
            --path . \
            --export-debug "Android (100% Offline APK)" \
            "build/$APK_NAME" \
            2>&1 | tee godot-export.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "::error::Godot export failed"
            exit 1
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Cannot export project|Failed to load script|Failed to instantiate an autoload|Failed to create an autoload" godot-export.log; then
            echo "::error::Godot export reported script or project errors"
            grep -E "SCRIPT ERROR|Parse Error|Compile Error|Cannot export project|Failed to load script|Failed to instantiate an autoload|Failed to create an autoload" godot-export.log
            exit 1
          fi
          echo "::notice::Android export completed with no errors"

      - name: Verify APK exists and is valid
        run: |
          ls -la build/
          test -f "build/$APK_NAME"
          test -s "build/$APK_NAME"
          unzip -t "build/$APK_NAME"
          echo "::notice::APK exists, is non-empty, and zip integrity verified"

      - name: Scan APK for offline permission compliance
        run: |
          APK_MANIFEST_TMP=$(mktemp -d)
          unzip -p "build/$APK_NAME" AndroidManifest.xml > "$APK_MANIFEST_TMP/AndroidManifest.xml" 2>/dev/null
          if [ ! -s "$APK_MANIFEST_TMP/AndroidManifest.xml" ]; then
            echo "::error::Could not extract AndroidManifest.xml from APK"
            rm -rf "$APK_MANIFEST_TMP"
            exit 1
          fi
          if grep -qi 'android.permission.INTERNET\|android.permission.ACCESS_NETWORK_STATE\|android.permission.ACCESS_WIFI_STATE\|android.permission.CHANGE_WIFI_STATE\|android.permission.CHANGE_NETWORK_STATE' "$APK_MANIFEST_TMP/AndroidManifest.xml"; then
            echo "::error::APK contains forbidden network permissions (offline lock violated)"
            cat "$APK_MANIFEST_TMP/AndroidManifest.xml"
            rm -rf "$APK_MANIFEST_TMP"
            exit 1
          fi
          rm -rf "$APK_MANIFEST_TMP"
          echo "::notice::No network permissions found in APK manifest (offline lock verified)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-wastes-black-protocol-apk
          path: build/$APK_NAME
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to GitHub Release (tag runs only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/$APK_NAME
          name: LUMEN WASTES - BLACK PROTOCOL - ${{ github.ref_name }}
          body: |
            100% Offline Android APK build for ${{ github.ref_name }}.
            Created, Directed & Developed by Tarun Loganathan.
          generate_release_notes: true
